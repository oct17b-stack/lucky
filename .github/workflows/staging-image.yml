name: 构建测试版镜像

# main 分支有更新时构建内网测试版镜像（amd64 + arm64）并推送到 GitHub 镜像仓库，
# NAS 上的 watchtower 会自动拉取。网址用仓库变量 LAN_URL（例如 http://192.168.1.100:3000）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支有新提交时，取消还在进行的旧构建
concurrency:
  group: staging-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_ENV=lan
            NEXT_PUBLIC_SITE_URL=${{ vars.LAN_URL || vars.STAGING_URL || 'http://localhost:3000' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lucky-web:staging
            ghcr.io/${{ github.repository_owner }}/lucky-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
