name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # 还没有 pnpm-lock.yaml，先关闭缓存；提交锁文件后可删掉这一行并去掉 --no-frozen-lockfile
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile --filter "./packages/**" --filter web
      - name: 计算核心与文案测试
        run: |
          set -o pipefail
          pnpm --filter "./packages/**" test 2>&1 | tee test.log
      - name: 类型检查
        run: |
          set -o pipefail
          { pnpm --filter web exec tsc --noEmit && pnpm --filter @lucky/db typecheck; } 2>&1 | tee typecheck.log
      - name: 构建网站
        run: |
          set -o pipefail
          pnpm --filter web build 2>&1 | tee build.log
      - name: 汇总关键指标
        if: always()
        run: |
          [ -f test.log ] && grep -hoE "(节气误差|与 Meeus 模型的最大差异)[^\r]*" test.log | while read -r line; do echo "::notice title=core::${line}"; done || true
      # 失败时把日志末尾作为注释（annotation）回传，方便在 API 和 PR 页面直接看到原因
      - name: 回传失败日志
        if: failure()
        run: |
          for f in test.log typecheck.log build.log; do
            [ -f "$f" ] || continue
            body=$(tail -n 60 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${f}::${body}"
          done
