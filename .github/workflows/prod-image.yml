name: 构建正式版镜像

# 手动运行，或推送 v1.0.0 这样的版本标签时构建。
# 正式服务器不会自动更新，需要在服务器上手动 pull。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: prod-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: 检查正式网址
        if: ${{ vars.PROD_URL == '' }}
        run: |
          echo "::error::请先在仓库 Settings → Secrets and variables → Actions → Variables 添加 PROD_URL，例如 https://example.com"
          exit 1
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/lucky-web:prod"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "ghcr.io/${{ github.repository_owner }}/lucky-web:${GITHUB_REF_NAME}"
            fi
            echo "ghcr.io/${{ github.repository_owner }}/lucky-web:prod-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_ENV=production
            NEXT_PUBLIC_SITE_URL=${{ vars.PROD_URL }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
